AWSTemplateFormatVersion: "2010-09-09"
Description: "Infraestrutura do painel de disponibilidade Status da Arateki (Cloudflare R2)"

Parameters:
  AlertEmail1:
    Type: String
    Default: ""
    Description: "Primeiro e-mail para receber alertas de queda e volta (opcional)"
  AlertEmail2:
    Type: String
    Default: ""
    Description: "Segundo e-mail para receber alertas de queda e volta (opcional)"
  BucketName:
    Type: String
    Default: "arateki-status"
    Description: "Nome do bucket Cloudflare R2"
  R2EndpointUrl:
    Type: String
    Default: ""
    Description: "Endpoint S3 do Cloudflare R2 (ex: https://<id>.r2.cloudflarestorage.com)"
  R2AccessKeyId:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Access Key ID do Cloudflare R2"
  R2SecretAccessKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Secret Access Key do Cloudflare R2"

Conditions:
  HasAlertEmail1: !Not [!Equals [!Ref AlertEmail1, ""]]
  HasAlertEmail2: !Not [!Equals [!Ref AlertEmail2, ""]]

Resources:
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arateki-status
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: arateki-status-alertas
      DisplayName: "Status da Arateki"

  EmailSubscription1:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail1
    Properties:
      Protocol: email
      TopicArn: !Ref AlertTopic
      Endpoint: !Ref AlertEmail1

  EmailSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail2
    Properties:
      Protocol: email
      TopicArn: !Ref AlertTopic
      Endpoint: !Ref AlertEmail2

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/arateki-status-checador
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arateki-status-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: arateki-status-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/arateki-status-checador:*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt DynamoDBTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertTopic

  CheckerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: arateki-status-checador
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: checador.lambda_handler.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "Placeholder para atualizacao via implantar.sh"}
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          TOPIC_ARN: !Ref AlertTopic
          BUCKET_NAME: !Ref BucketName
          R2_ENDPOINT_URL: !Ref R2EndpointUrl
          R2_ACCESS_KEY_ID: !Ref R2AccessKeyId
          R2_SECRET_ACCESS_KEY: !Ref R2SecretAccessKey

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arateki-status-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
      Policies:
        - PolicyName: invoke-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CheckerLambda.Arn

  CheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: arateki-status-checagem-minuto
      Description: "Executa checador de disponibilidade da Arateki a cada 1 minuto"
      ScheduleExpression: "rate(1 minute)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt CheckerLambda.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  DynamoDBTableName:
    Description: "Nome da tabela DynamoDB"
    Value: !Ref DynamoDBTable
  SNSTopicArn:
    Description: "ARN do tópico SNS de alertas"
    Value: !Ref AlertTopic
  LambdaFunctionName:
    Description: "Nome da função Lambda checadora"
    Value: !Ref CheckerLambda
