AWSTemplateFormatVersion: "2010-09-09"
Description: "Infraestrutura do painel de disponibilidade Status da Arateki"

Parameters:
  AlertEmail1:
    Type: String
    Default: ""
    Description: "Primeiro e-mail para receber alertas de queda e volta (opcional)"
  AlertEmail2:
    Type: String
    Default: ""
    Description: "Segundo e-mail para receber alertas de queda e volta (opcional)"
  BucketName:
    Type: String
    Default: ""
    Description: "Nome do bucket S3 ou R2 (opcional; se vazio cria bucket S3 automático)"
  R2EndpointUrl:
    Type: String
    Default: ""
    Description: "Endpoint S3 do Cloudflare R2 (ex: https://<id>.r2.cloudflarestorage.com, opcional)"
  R2AccessKeyId:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Access Key ID do Cloudflare R2 (opcional)"
  R2SecretAccessKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Secret Access Key do Cloudflare R2 (opcional)"
  LambdaCodeBucket:
    Type: String
    Default: ""
    Description: "Bucket S3 onde está o zip do código da Lambda (preenchido no deploy)"
  LambdaCodeKey:
    Type: String
    Default: "checador.zip"
    Description: "Chave S3 do zip do código da Lambda"

Conditions:
  HasAlertEmail1: !Not [!Equals [!Ref AlertEmail1, ""]]
  HasAlertEmail2: !Not [!Equals [!Ref AlertEmail2, ""]]
  CreateS3Bucket: !Equals [!Ref BucketName, ""]
  HasCodeBucket: !Not [!Equals [!Ref LambdaCodeBucket, ""]]

Resources:
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: arateki-status
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: arateki-status-alertas
      DisplayName: "Status da Arateki"

  EmailSubscription1:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail1
    Properties:
      Protocol: email
      TopicArn: !Ref AlertTopic
      Endpoint: !Ref AlertEmail1

  EmailSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail2
    Properties:
      Protocol: email
      TopicArn: !Ref AlertTopic
      Endpoint: !Ref AlertEmail2

  StatusBucket:
    Type: AWS::S3::Bucket
    Condition: CreateS3Bucket
    Properties:
      BucketName: !Sub "arateki-status-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  StatusBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateS3Bucket
    Properties:
      Bucket: !Ref StatusBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${StatusBucket}/*"

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/arateki-status-checador
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arateki-status-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: arateki-status-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/arateki-status-checador:*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt DynamoDBTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource:
                  - !If
                    - CreateS3Bucket
                    - !Sub "arn:aws:s3:::${StatusBucket}/*"
                    - !Sub "arn:aws:s3:::${BucketName}/*"

  CheckerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: arateki-status-checador
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: checador.lambda_handler.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "Placeholder para atualizacao via implantar.sh"}
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          TOPIC_ARN: !Ref AlertTopic
          BUCKET_NAME: !If [CreateS3Bucket, !Ref StatusBucket, !Ref BucketName]
          S3_ENDPOINT_URL: !Ref R2EndpointUrl
          R2_ACCESS_KEY_ID: !Ref R2AccessKeyId
          R2_SECRET_ACCESS_KEY: !Ref R2SecretAccessKey

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arateki-status-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CheckerLambda.Arn

  CheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: arateki-status-checagem-minuto
      Description: "Executa checador de disponibilidade da Arateki a cada 1 minuto"
      ScheduleExpression: "rate(1 minute)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt CheckerLambda.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  DynamoDBTableName:
    Description: "Nome da tabela DynamoDB"
    Value: !Ref DynamoDBTable
  SNSTopicArn:
    Description: "ARN do tópico SNS de alertas"
    Value: !Ref AlertTopic
  LambdaFunctionName:
    Description: "Nome da função Lambda checadora"
    Value: !Ref CheckerLambda
  StatusBucketName:
    Condition: CreateS3Bucket
    Description: "Nome do bucket S3 onde a página e status.json são salvos"
    Value: !Ref StatusBucket
  StatusBucketWebsiteUrl:
    Condition: CreateS3Bucket
    Description: "URL do Website Hosting do Bucket S3"
    Value: !GetAtt StatusBucket.WebsiteURL
